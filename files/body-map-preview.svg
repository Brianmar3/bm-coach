<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
  <rect width="100%" height="100%" fill="#000000" />
  <!-- Modal box -->
  <g transform="translate(100,60)">
    <rect x="0" y="0" width="1000" height="600" rx="18" fill="#0b0b0b" stroke="#222" stroke-width="1" />
    <!-- Close button -->
    <rect x="950" y="18" width="34" height="28" rx="6" fill="#1f1f1f" />
    <text x="967" y="36" fill="#ccc" font-size="18" font-family="Arial">✕</text>
    <!-- Title -->
    <text x="28" y="40" fill="#F5C518" font-size="28" font-family="Arial" font-weight="700">Mapa corporal semanal</text>

    <!-- Summary -->
    <g transform="translate(28,64)">
      <text x="0" y="0" fill="#c9c9c9" font-size="14" font-family="Arial">Tren superior: <tspan fill="#ffffff" font-weight="700">64%</tspan></text>
      <text x="0" y="22" fill="#c9c9c9" font-size="14" font-family="Arial">Tren inferior: <tspan fill="#ffffff" font-weight="700">36%</tspan></text>
      <text x="0" y="44" fill="#777" font-size="12" font-family="Arial">Serie máxima de referencia: <tspan fill="#fff">8 series</tspan></text>
    </g>

    <!-- Frontal SVG -->
    <g transform="translate(120,120)">
      <rect x="0" y="0" width="340" height="480" rx="12" fill="#070707" />
      <g transform="translate(20,10)">
        <!-- torso chest -->
        <rect x="70" y="20" width="60" height="90" rx="12" fill="#d4af37" stroke="#111" />
        <!-- abdomen -->
        <rect x="70" y="110" width="60" height="60" rx="12" fill="#2a2a2a" stroke="#111" />
        <!-- hips/glutes -->
        <rect x="60" y="180" width="80" height="40" rx="10" fill="#ff9f1c" stroke="#111" />
        <!-- legs quad -->
        <rect x="70" y="230" width="26" height="120" rx="10" fill="#f6e58d" stroke="#111" />
        <rect x="104" y="230" width="26" height="120" rx="10" fill="#f6e58d" stroke="#111" />
        <!-- calves -->
        <rect x="70" y="350" width="26" height="40" rx="8" fill="#2a2a2a" stroke="#111" />
        <rect x="104" y="350" width="26" height="40" rx="8" fill="#2a2a2a" stroke="#111" />
        <!-- arms biceps -->
        <rect x="20" y="30" width="22" height="120" rx="12" fill="#d4af37" stroke="#111" />
        <rect x="170" y="30" width="22" height="120" rx="12" fill="#d4af37" stroke="#111" />
        <!-- triceps forearm approx -->
        <rect x="20" y="160" width="22" height="40" rx="10" fill="#f6e58d" stroke="#111" />
        <rect x="170" y="160" width="22" height="40" rx="10" fill="#f6e58d" stroke="#111" />
        <!-- shoulders -->
        <ellipse cx="70" cy="20" rx="14" ry="10" fill="#ff9f1c" stroke="#111" />
        <ellipse cx="130" cy="20" rx="14" ry="10" fill="#ff9f1c" stroke="#111" />
      </g>
      <text x="170" y="470" font-size="14" fill="#ddd" font-family="Arial" text-anchor="middle">Frontal</text>
    </g>

    <!-- Posterior SVG -->
    <g transform="translate(540,120)">
      <rect x="0" y="0" width="340" height="480" rx="12" fill="#070707" />
      <g transform="translate(20,10)">
        <!-- upper back -->
        <rect x="70" y="20" width="60" height="90" rx="12" fill="#d4af37" stroke="#111" />
        <!-- glutes -->
        <rect x="60" y="110" width="80" height="70" rx="10" fill="#ff9f1c" stroke="#111" />
        <!-- posterior thigh hamstrings -->
        <rect x="70" y="190" width="26" height="170" rx="10" fill="#f6e58d" stroke="#111" />
        <rect x="104" y="190" width="26" height="170" rx="10" fill="#f6e58d" stroke="#111" />
        <!-- calves -->
        <rect x="70" y="360" width="26" height="60" rx="8" fill="#2a2a2a" stroke="#111" />
        <rect x="104" y="360" width="26" height="60" rx="8" fill="#2a2a2a" stroke="#111" />
        <!-- arms back triceps -->
        <rect x="20" y="30" width="22" height="120" rx="12" fill="#f6e58d" stroke="#111" />
        <rect x="170" y="30" width="22" height="120" rx="12" fill="#f6e58d" stroke="#111" />
        <!-- shoulders -->
        <ellipse cx="70" cy="20" rx="14" ry="10" fill="#ff9f1c" stroke="#111" />
        <ellipse cx="130" cy="20" rx="14" ry="10" fill="#ff9f1c" stroke="#111" />
      </g>
      <text x="170" y="470" font-size="14" fill="#ddd" font-family="Arial" text-anchor="middle">Posterior</text>
    </g>

    <!-- Legend -->
    <g transform="translate(28,560)">
      <rect x="0" y="0" width="940" height="40" rx="8" fill="#0b0b0b" />
      <g transform="translate(10,8)" font-family="Arial" font-size="12">
        <g transform="translate(0,0)">
          <rect x="0" y="0" width="12" height="12" fill="#2a2a2a" />
          <text x="18" y="10" fill="#c9c9c9">Sin series</text>
        </g>
        <g transform="translate(120,0)">
          <rect x="0" y="0" width="12" height="12" fill="#f6e58d" />
          <text x="18" y="10" fill="#c9c9c9">Volumen bajo</text>
        </g>
        <g transform="translate(260,0)">
          <rect x="0" y="0" width="12" height="12" fill="#d4af37" />
          <text x="18" y="10" fill="#c9c9c9">Volumen medio</text>
        </g>
        <g transform="translate(420,0)">
          <rect x="0" y="0" width="12" height="12" fill="#ff9f1c" />
          <text x="18" y="10" fill="#c9c9c9">Volumen alto</text>
        </g>
      </g>
    </g>

  </g>
</svg>